# Random scene generation, version 2. World frame: table top at z = 0, z up, metres.
# Changes from v1, all based on measurements:
#  - table darker and lights about 25 % weaker: v1 background median grey 205 vs 42 in real
#    T-LESS scene 1, parts 193 vs 169 (scripts/compare_brightness.py)
#  - stacked drop heights: in v1 two parts started inside each other and one was pushed
#    through the table; spacing exceeds the largest part's bounding-sphere diameter (about 0.149 m)
schema_version: 2
seed: 2026
dataset_root: data/raw/tless
models: models_cad
mesh_unit_to_m: 0.001
objects: [2, 25, 29, 30]
objects_per_scene: [3, 6]
image: {width: 720, height: 540}
intrinsics: {fx: 1075.65, fy: 1073.90, cx: 360.0, cy: 270.0}
camera:
  distance_m: [0.65, 0.90]
  elevation_deg: [45, 85]
  azimuth_deg: [0, 360]
  target_jitter_m: 0.05
placement:
  area_m: 0.30
  drop_height_m: [0.08, 0.09]
  stack_spacing_m: 0.16
lights:
  count: [1, 3]
  energy_w: [15, 110]
  distance_m: [0.5, 1.5]
  elevation_deg: [20, 85]
world_background_strength: [0.0, 0.3]
object_material:
  gray: [0.2, 0.9]
  roughness: [0.1, 0.9]
  metallic: [0.0, 0.5]
table_material:
  gray: [0.005, 0.08]
  roughness: [0.3, 1.0]