[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synperc"
version = "0.1.0"
description = "Synthetic-to-real data pipeline for industrial perception"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "opencv-python",
    "open3d",
    "pandas",
    "matplotlib",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]